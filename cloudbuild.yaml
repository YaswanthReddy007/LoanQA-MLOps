# cloudbuild.yaml
# Google Cloud Build configuration for Doc-Understand
# Automates: Build → Push → Deploy to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-understand:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
    id: 'push-image-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-understand:latest'
    id: 'push-image-latest'

  # Step 3: Deploy to Cloud Run with secrets
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'doc-understand'
      - '--image=gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--max-instances=10'
      - '--set-env-vars=USE_GCS_OUTPUT=true,AWS_REGION=us-east-1,GCS_BUCKET_NAME=doc-understand-storage,S3_BUCKET=textract-bucket-yash07,GCP_PROJECT_ID=doc-understand'
      - '--update-secrets=GROQ_API_KEY=GROQ_API_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest'
    id: 'deploy-cloud-run'

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/doc-understand:latest'

# Build timeout
timeout: '1200s'

# Options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY